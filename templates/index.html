<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red-Eye Reduction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .upload-box {
            margin-top: 30px;
            padding: 30px;
            border: 2px dashed #aaa;
            border-radius: 12px;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Red-Eye Reduction</h1>

        <p>
            Upload an image and reduce the red-eye effect using
            OpenCV image processing.
        </p>

        <div class="upload-box">

            <form action="/process" method="POST" enctype="multipart/form-data">

                <label for="image">
                    Select an image:
                </label>

                <br>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                    required
                >

                <br>

                <button type="submit">
                    Remove Red-Eye
                </button>

            </form>

        </div>

    </div>

</body>
</html>
