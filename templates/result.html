<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Red-Eye Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .card h2 {
            margin-top: 0;
        }

        img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>Red-Eye Reduction Result</h1>

    <p class="subtitle">
        Compare the original image with the corrected image.
    </p>

    <div class="images">

        <div class="card">

            <h2>Original Image</h2>

            <img
                src="{{ url_for('uploaded_file', filename=original) }}"
                alt="Original Image"
            >

        </div>

        <div class="card">

            <h2>Corrected Image</h2>

            <img
                src="{{ url_for('uploaded_file', filename=corrected) }}"
                alt="Corrected Image"
            >

        </div>

    </div>

    <a href="/" class="button">
        Process Another Image
    </a>

</body>
</html>
